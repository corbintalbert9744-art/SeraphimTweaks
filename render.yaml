# =============================================================================
# Seraphim IQ — Render Blueprint (Account A only)
# =============================================================================
# Use a DIFFERENT Render account than Seraphim Tweaks so free-tier hours / the
# one free Postgres do not compete.
#
# Deploy:
#   1. Log into the IQ Render account (not the Tweaks account)
#   2. Dashboard → New → Blueprint
#   3. Connect repo SeraphimTweaks
#   4. Branch: cursor/iq-render-account-754e  (or main once this is merged)
#   5. Blueprint path: render.yaml
#   6. After deploy: Custom Domain → seraphimiq.com
#   7. Add API keys (PROPLINE_API_KEY, Stripe, etc.) under each service → Environment
#
# Free tier:
#   - Web services sleep after ~15 min idle (first hit can take ~1 min)
#   - 1 free Postgres per Render workspace — this blueprint uses it
#   - Do NOT put Tweaks on this same account
# =============================================================================

databases:
  - name: seraphim-iq-db
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: []

services:
  # Python warehouse / odds sync (internal API for IQ only)
  - type: web
    name: seraphim-iq-data
    runtime: python
    plan: free
    region: oregon
    rootDir: data-platform
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt
    startCommand: PYTHONPATH=. uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: DATABASE_URL
        fromDatabase:
          name: seraphim-iq-db
          property: connectionString
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: BOOTSTRAP_NBA_SYNC
        value: "true"
      - key: BOOTSTRAP_MULTI_SPORT
        value: "true"

  # Public Seraphim IQ site + membership API → seraphimiq.com
  - type: web
    name: seraphim-iq
    runtime: node
    plan: free
    region: oregon
    autoDeployTrigger: commit
    # --include=dev: NODE_ENV=production would otherwise skip vite/tsx (devDependencies)
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node scripts/migrate.mjs && node dist/index.cjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: "--max-old-space-size=460"
      - key: DATABASE_URL
        fromDatabase:
          name: seraphim-iq-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: DATA_PLATFORM_PROXY
        value: "1"
      # Bare host is expanded to https://*.onrender.com by server/runtimeConfig.ts
      - key: DATA_PLATFORM_URL
        fromService:
          name: seraphim-iq-data
          type: web
          property: host
