# Seraphim Analytics — FREE Render Blueprint
# Dashboard → New → Blueprint → branch: cursor/market-vs-model-754e
#
# Free tier notes:
#   - Site sleeps after ~15 min idle (first load ~1 min)
#   - Free Postgres expires after 30 days (upgrade or export before then)
#   - Only 1 free Postgres per Render workspace

databases:
  - name: seraphim-db
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: []

services:
  # Python warehouse / odds sync (internal API)
  - type: web
    name: seraphim-data
    runtime: python
    plan: free
    region: oregon
    rootDir: data-platform
    buildCommand: pip install -r requirements.txt
    startCommand: PYTHONPATH=. uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: DATABASE_URL
        fromDatabase:
          name: seraphim-db
          property: connectionString
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: BOOTSTRAP_NBA_SYNC
        value: "true"
      - key: PROPLINE_API_KEY
        sync: false
      - key: SHARPAPI_API_KEY
        sync: false
      - key: ODDS_API_KEY
        sync: false
      - key: ANTELYTICS_API_KEY
        sync: false

  # Public website + membership API
  - type: web
    name: seraphim
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: node scripts/migrate.mjs && node dist/index.cjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: seraphim-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: DATA_PLATFORM_PROXY
        value: "1"
      - key: DATA_PLATFORM_URL
        fromService:
          name: seraphim-data
          type: web
          property: host
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_STANDARD_MONTHLY
        sync: false
      - key: STRIPE_PRICE_STANDARD_YEARLY
        sync: false
      - key: STRIPE_PRICE_PRO_MONTHLY
        sync: false
      - key: STRIPE_PRICE_PRO_YEARLY
        sync: false
