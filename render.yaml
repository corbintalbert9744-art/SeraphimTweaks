services:
  - type: web
    name: seraphim-iq
    env: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run db:push && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: seraphim-iq-db
          property: connectionString

databases:
  - name: seraphim-iq-db
    plan: free
