# Seraphim Analytics — Render Blueprint
# https://dashboard.render.com → New → Blueprint → connect GitHub repo
#
# After deploy:
#   1. Open the service URL → /api/health (dataPlatform.ok should be true)
#   2. Stripe webhook → https://<service>.onrender.com/api/stripe/webhook
#   3. Optional: set APP_URL explicitly to that https URL in the dashboard

databases:
  - name: seraphim-db
    plan: basic-256mb
    postgresMajorVersion: "16"
    ipAllowList: [] # private — only Render private network

services:
  - type: web
    name: seraphim
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    # Runs Node (public PORT) + Python data-platform (127.0.0.1:8000) in one container
    dockerCommand: "node scripts/migrate.mjs && node scripts/start-stack.mjs"
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: seraphim-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: DATA_PLATFORM_URL
        value: http://127.0.0.1:8000
      - key: DATA_PLATFORM_PROXY
        value: "1"
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: BOOTSTRAP_NBA_SYNC
        value: "true"
      - key: PYTHON
        value: /opt/venv/bin/python
      # RENDER_EXTERNAL_URL is injected by Render and used as APP_URL fallback

      # Enter these in the Blueprint wizard (or later in Environment)
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_STANDARD_MONTHLY
        sync: false
      - key: STRIPE_PRICE_STANDARD_YEARLY
        sync: false
      - key: STRIPE_PRICE_PRO_MONTHLY
        sync: false
      - key: STRIPE_PRICE_PRO_YEARLY
        sync: false
      - key: PROPLINE_API_KEY
        sync: false
      - key: SHARPAPI_API_KEY
        sync: false
      - key: ODDS_API_KEY
        sync: false
      - key: ANTELYTICS_API_KEY
        sync: false
